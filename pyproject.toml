[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "on-device-llm-optimizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mlx",
  "mlx-lm",
  "coremltools>=9.0",
  "transformers>=5.19.0",
  "datasets>=5.1.0",
  "streamlit>=1.65.0",
  "plotly>=7.1.0",
  "psutil>=7.2.2",
  "pyyaml>=6.0.3",
  "pytest>=9.1.1",
  "numpy>=2.4.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
