[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "on-device-llm-optimizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mlx",
  "mlx-lm",
  "coremltools>=7.0",
  "transformers>=4.40",
  "datasets>=2.18",
  "streamlit>=1.33",
  "plotly>=5.20",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "pytest>=8.0",
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
