[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "on-device-llm-optimizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mlx",
  "mlx-lm",
  "coremltools>=9.0",
  "transformers>=5.21.0",
  "datasets>=5.1.0",
  "streamlit>=1.66.1",
  "plotly>=7.1.0",
  "psutil>=7.2.2",
  "pyyaml>=6.0.3",
  "pytest>=9.2.0",
  "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "flake8>=7.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
