# DaemonSet: deploy quantized LLM inference to every edge node
# Each edge node runs exactly one pod with the GGUF model loaded in memory.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-llm-server
  namespace: edge-inference
  labels:
    app: edge-llm-server
    component: inference
    version: "1.0.0"
spec:
  selector:
    matchLabels:
      app: edge-llm-server
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1       # update one node at a time
  template:
    metadata:
      labels:
        app: edge-llm-server
        component: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # Only schedule on nodes explicitly labeled for edge inference
      nodeSelector:
        edge-inference: "enabled"

      tolerations:
        - key: edge-node
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      # Give each node 30s to finish in-flight requests before pod is removed
      terminationGracePeriodSeconds: 30

      serviceAccountName: edge-llm-sa
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # ── Init: verify GGUF model present on node hostPath ──────────────────
      initContainers:
        - name: download-model-if-missing
          image: ghcr.io/shaikn6/on-device-llm-optimizer:latest
          command:
            - sh
            - -c
            - |
              set -e
              MODEL_PATH="/mnt/models/$(MODEL_FILENAME)"
              CHECKSUM_PATH="${MODEL_PATH}.sha256"

              if [[ -f "${MODEL_PATH}" && -f "${CHECKSUM_PATH}" ]]; then
                EXPECTED=$(cat "${CHECKSUM_PATH}")
                ACTUAL=$(sha256sum "${MODEL_PATH}" | awk '{print $1}')
                if [[ "${EXPECTED}" == "${ACTUAL}" ]]; then
                  echo "Model already present and verified: ${MODEL_PATH}"
                  exit 0
                fi
                echo "Checksum mismatch — re-downloading..."
              fi

              echo "Downloading model from ${MODEL_REGISTRY_URL}/${MODEL_FILENAME}..."
              curl -fsSL \
                -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
                -o "${MODEL_PATH}" \
                "${MODEL_REGISTRY_URL}/${MODEL_FILENAME}"

              # Verify after download
              EXPECTED=$(cat "${CHECKSUM_PATH}" 2>/dev/null || echo "")
              if [[ -n "${EXPECTED}" ]]; then
                ACTUAL=$(sha256sum "${MODEL_PATH}" | awk '{print $1}')
                [[ "${EXPECTED}" == "${ACTUAL}" ]] || { echo "Checksum verification FAILED"; exit 1; }
                echo "Model verified: ${ACTUAL}"
              fi
          env:
            - name: MODEL_FILENAME
              valueFrom:
                configMapKeyRef:
                  name: edge-llm-config
                  key: model_filename
            - name: MODEL_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: edge-llm-config
                  key: model_registry_url
            - name: REGISTRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: edge-llm-secrets
                  key: registry_token
          volumeMounts:
            - name: model-store
              mountPath: /mnt/models
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

      containers:
        - name: llama-server
          image: ghcr.io/ggerganov/llama.cpp:server-cuda
          imagePullPolicy: IfNotPresent
          command:
            - /app/llama-server
          args:
            - "--model"
            - "/mnt/models/$(MODEL_FILENAME)"
            - "--ctx-size"
            - "$(CTX_SIZE)"
            - "--n-gpu-layers"
            - "$(GPU_LAYERS)"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--threads"
            - "$(CPU_THREADS)"
            - "--batch-size"
            - "512"
            - "--rope-scaling"
            - "linear"
            - "--metrics"          # expose /metrics endpoint for Prometheus
          env:
            - name: MODEL_FILENAME
              valueFrom:
                configMapKeyRef:
                  name: edge-llm-config
                  key: model_filename
            - name: CTX_SIZE
              valueFrom:
                configMapKeyRef:
                  name: edge-llm-config
                  key: context_size
            - name: GPU_LAYERS
              valueFrom:
                configMapKeyRef:
                  name: edge-llm-config
                  key: gpu_layers       # 0 = CPU-only; 35 = full offload for 7B model
            - name: CPU_THREADS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              cpu: "8"
              memory: 12Gi
              # Uncomment for GPU-enabled edge nodes:
              # nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-store
              mountPath: /mnt/models
              readOnly: true
            - name: llama-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30       # model loading takes time
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]  # drain in-flight
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: model-store
          hostPath:
            path: /var/lib/edge-llm/models   # node-local NVMe for fast model load
            type: DirectoryOrCreate
        - name: llama-tmp
          emptyDir:
            sizeLimit: 2Gi

      imagePullSecrets:
        - name: ghcr-pull-secret

      # Prioritize edge pods — don't evict under memory pressure
      priorityClassName: system-node-critical

---
apiVersion: v1
kind: Service
metadata:
  name: edge-llm-server
  namespace: edge-inference
  labels:
    app: edge-llm-server
spec:
  selector:
    app: edge-llm-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  # NodePort for local clients on the same edge node
  type: NodePort
