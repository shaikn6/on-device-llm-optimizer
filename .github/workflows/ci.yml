# Two jobs:
#   lint-and-cpu-tests — ubuntu, cross-platform. Lints and runs the MLX-free unit
#     tests (config + pins). These import no Apple-only code, so they gate every PR.
#   apple-silicon-tests — macos-latest is Apple Silicon (arm64), where MLX installs,
#     so the full suite runs here as a real, blocking gate.
# To run locally on Apple Silicon: pytest tests/ -v --cov=src --cov-report=term-missing

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: "1"

jobs:
  lint-and-cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install lint + CPU test tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
      - name: Lint
        run: |
          flake8 . --max-line-length=120 --extend-ignore=E203,W503,E402,E221,E222,E225,E251,E261,E272,E302,E303,E305,E306,E127,E128,E231,E501,E701,E712,E741,F541,F841,F811 --exclude=.git,__pycache__,.venv,.venv-cpu,build,dist
      - name: CPU-only tests (no MLX, no downloads)
        run: pytest tests/test_config.py tests/test_pins.py -v

  apple-silicon-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full test suite with coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing
